name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build (debug)
        run: swift build

      - name: Test (XCTest)
        run: swift test

      - name: Smoke (hermetic pure mode)
        run: swift run VozaSmoke

      - name: Smoke (V01 isolation suite)
        run: swift run VozaSmoke v01

      - name: Smoke (Corrections & Auto-Learn suite)
        run: swift run VozaSmoke corrections

      # V02-AC04 (inspection): this workflow builds debug, runs tests and
      # hermetic smokes ONLY — no release build, no model downloads, no mic
      # capture, no network calls to providers, no secrets.
